<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VibePaint — a Photoshop-lite image editor · Ross Grant</title>
    <meta name="description" content="VibePaint: a layered image editor in the browser with selections, brushes, filters, adjustments and free transform.">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="back" href="../index.html" title="Back to Portfolio"><i class="ph ph-arrow-left"></i><span>Portfolio</span></a>
        <span class="brand">Vibe<b>Paint</b></span>
        <nav class="menubar" id="menubar" aria-label="Menu"></nav>
        <span class="doc-title" id="doc-title"></span>
        <button class="icon-btn panel-toggle" id="panel-toggle" type="button" title="Panels"><i class="ph ph-stack"></i></button>
    </header>

    <div class="optionsbar" id="optionsbar"></div>

    <div class="workspace">
        <aside class="toolbar" id="toolbar" aria-label="Tools"></aside>
        <main class="stage" id="stage">
            <canvas id="view"></canvas>
            <div class="drop-hint" id="drop-hint" hidden>Drop an image to place it as a new layer</div>
        </main>
        <aside class="panels" id="panels">
            <section class="panel" data-panel="color">
                <h2>Color</h2>
                <div class="panel-body" id="color-panel"></div>
            </section>
            <section class="panel" data-panel="layers">
                <h2>Layers</h2>
                <div class="panel-body" id="layers-panel"></div>
            </section>
            <section class="panel" data-panel="history">
                <h2>History</h2>
                <div class="panel-body" id="history-panel"></div>
            </section>
        </aside>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
    <div id="dialog-root"></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <noscript><p class="noscript">VibePaint needs JavaScript.</p></noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
